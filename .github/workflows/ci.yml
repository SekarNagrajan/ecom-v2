# Created by Sekar Nagarajan (2026-11-12 23:10)
# Quality gate for every push and pull request: install → typecheck (ratcheted against the
# committed baseline) → lint → unit tests → production build.
name: CI

on:
  push:
    branches: [master, ecom-v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (baseline ratchet)
        run: pnpm typecheck:ci

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
