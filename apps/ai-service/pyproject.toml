[project]
name = "ai-service"
version = "0.1.0"
description = "E-com AI assistant FastAPI service (Claude + browser-executed tools)"
readme = "README.md"
authors = [
    { name = "Sekar Nagarajan", email = "sekarnagarajan2104@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "chromadb>=1.5.9",
    "fakeredis>=2.40.0",
    "openai>=3.35.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
